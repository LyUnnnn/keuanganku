<div class="form-header">
  <h1>Tambah Transaksi</h1>
  <p>Isi data transaksi lalu kirim ke Google Sheets</p>
</div>

<!-- Timestamp -->
<div class="timestamp-row">
  <span class="timestamp-label">Timestamp Otomatis</span>
  <span class="timestamp-val" id="timestamp-display">—</span>
</div>

<!-- Jenis -->
<div class="jenis-selector" id="jenis-selector">
  <button class="jenis-btn" data-val="Masuk">
    <span class="jenis-icon">+</span>Masuk
  </button>
  <button class="jenis-btn" data-val="Keluar">
    <span class="jenis-icon">-</span>Keluar
  </button>
  <button class="jenis-btn" data-val="Netral">
    <span class="jenis-icon">=</span>Transfer
  </button>
</div>

<form id="form-transaksi">
  <div class="form-card">
    <div class="form-grid">

      <div class="form-group">
        <label class="field-required" for="tanggal">Tanggal Input</label>
        <input type="date" id="tanggal" required>
      </div>

      <div class="form-group">
        <label class="field-required" for="nominal">Nominal</label>
        <div class="nominal-wrap">
          <span class="nominal-prefix">Rp</span>
          <input type="number" id="nominal" placeholder="0" min="0" required>
        </div>
        <div class="nominal-display" id="nominal-display"></div>
      </div>

      <div class="form-group full">
        <label class="field-required" for="deskripsi">Deskripsi</label>
        <textarea id="deskripsi" placeholder="Contoh: Makan siang di warteg, Gaji bulan Januari..." required></textarea>
      </div>

      <div class="form-group" id="kategori-group">
        <label class="field-required" for="kategori" id="kategori-label">Kategori</label>
        <select id="kategori" required>
        </select>
      </div>

      <div class="form-group" id="kelompok-group">
        <label for="kelompok" id="kelompok-label">Kelompok Kategori</label>
        <select id="kelompok">
        </select>
      </div>

    </div>
  </div>

  <!-- Sumber Uang -->
  <div class="form-card" id="sumber-card">
    <label style="display:block;margin-bottom:12px" class="field-required" id="sumber-label">Sumber Uang</label>
    <div class="sumber-grid" id="sumber-grid">
    </div>
    <input type="hidden" id="sumber" required>
  </div>

  <div class="form-card" id="transfer-target-card" hidden>
    <label style="display:block;margin-bottom:12px" class="field-required">Akun Tujuan</label>
    <div class="sumber-grid" id="tujuan-grid">
    </div>
    <input type="hidden" id="tujuan">
  </div>

  <div class="form-actions">
    <button type="submit" class="btn-submit" id="btn-submit">
      <div class="spinner"></div>
      <span class="btn-text">Kirim ke Google Sheets</span>
    </button>
    <button type="button" class="btn-reset" onclick="resetForm()">Reset</button>
  </div>
</form>
